<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BountyRadar</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark">
          <img src="icons/icon48.png" alt="BountyRadar" />
        </div>
        <h1>BountyRadar</h1>
      </div>
      <div id="count-badge" class="badge hidden"></div>
    </header>

    <div class="toolbar">
      <button id="chatgpt-btn" class="btn"><span id="chatgpt-label">Chatgpt</span></button>
      <button id="copy-btn" class="btn"><span id="copy-label">Copy</span></button>
      <button id="clear-btn" class="btn btn-danger"><span>Clear</span></button>
      <button id="dorks-btn" class="btn btn-push" aria-pressed="false"><span id="dorks-label">Dorks</span></button>
    </div>

    <section id="site-card" class="site-card hidden">
      <div class="site-head">
        <span class="site-label">This site</span>
        <span id="site-domain" class="site-domain"></span>
        <button id="site-recheck" class="link-btn" title="Check this site again now">Recheck</button>
      </div>
      <div id="site-status" class="site-status"></div>
      <div id="site-programs"></div>
    </section>

    <label class="setting-row" title="Looks up each site you visit in public bug bounty directories and checks its security.txt, security links, and common program paths. Requests go only to the site you're on (plus a weekly directory download from GitHub).">
      <input id="check-sites-toggle" type="checkbox" checked />
      <span>Check every site I visit for a bug bounty program</span>
    </label>

    <label class="setting-row" title="When on, BountyRadar fetches the result links on Google search pages in the background to check them for bounty programs. Those sites will see a request from your browser.">
      <input id="scan-serp-toggle" type="checkbox" />
      <span>Also scan Google search results in the background</span>
    </label>

    <div class="search-row">
      <svg
        class="search-icon"
        viewBox="0 0 24 24"
        width="15"
        height="15"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        id="search-input"
        type="text"
        placeholder="Search programs..."
        autocomplete="off"
        spellcheck="false"
      />
      <button id="search-clear" class="search-clear hidden" title="Clear search">✕</button>
    </div>

    <div id="dork-view" class="hidden">
      <p class="dork-hint" id="dork-hint"></p>
      <div id="dork-list"></div>
    </div>

    <main id="program-list"></main>

    <footer id="empty-state" class="empty hidden">
      <div class="empty-icon">🎯</div>
      <p><strong>No bug bounty programs tracked yet</strong></p>
      <p>
        Browse pages containing keywords like <em>bounty</em>, <em>reward</em>,
        <em>monetary</em>, <em>eligible targets</em> and they'll be saved here.
      </p>
    </footer>

    <div class="credit">
      Built by
      <a href="https://sudoninja-noob.github.io/" target="_blank" rel="noopener noreferrer">sudoninja-noob</a>
    </div>

    <script src="common.js"></script>
    <script src="dorks.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
